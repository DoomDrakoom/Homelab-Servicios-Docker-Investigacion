services:
  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    hostname: doomyyyserver
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/doomyyy/docker/syncthing/config:/var/syncthing/config
      - /obsidian:/var/syncthing/vault
    ports:
      - 8384:8384       # WebUI
      - 22000:22000/tcp # sync protocol
      - 22000:22000/udp
      - 21027:21027/udp # discovery local
    restart: unless-stopped
